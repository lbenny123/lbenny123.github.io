title: benny's Magic journey
subtitle:
description: Becoming is not my concern. Leaving traces—that’s enough.
keywords:
author: benny
language: zh-CN
timezone: Asia/Shanghai

url: https://lbenny123.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :year-:month-:day-:title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter:
highlight:
  enable: false
prismjs:
  enable: false

index_generator:
  path: ''
  per_page: 10
  order_by: -date

default_category: thought-corner
category_map:
  thought_corner: thought-corner
tag_map:

meta_generator: true

date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

per_page: 10
pagination_dir: page

theme: particlex

deploy:
  type: git
  repo: https://github.com/lbenny123/lbenny123.github.io.git
  branch: master
  message: "Site updated: {{ now('yyyy-MM-dd HH:mm:ss') }}"
